# ================== PostgreSQL Database Configuration ==================
spring.datasource.url=jdbc:postgresql://localhost:5432/flashsale
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ================== JPA / Hibernate ==================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ================== Logging ==================
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.devon.flashsale=DEBUG
logging.file.name=C:\\Users\\Md Khalid Shahzad\\Projects\\FlashSale Logs\\devon-flashsale.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [CorrelationId : %X{correlationId}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [CorrelationId = %X{correlationId}] %logger{36} - %msg%n

# ================== Management Configuration ==================
management.endpoints.web.exposure.include=health,metrics

# ================== JWT Configuration ==================
jwt.secret=flashsaleTicketingApplicationSecretKeyForAuthenticatingJwtTokens
jwt.expiration=86400000

# ================== Local image storage ==================
app.storage.location=uploads/events
app.storage.public.path=/uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
